appId: com.masterscoring.app
productName: Master Scoring
copyright: Copyright © 2026 Master Scoring
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!src/**'
  - '!scripts/**'
  - '!resources/**'
  - '!release/**'
  # onnxruntime-node: bỏ bản Linux (app chỉ build Windows / macOS)
  - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
asar: true
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
  # onnxruntime-node (TTS): file .node / .dll / .dylib phải nằm ngoài asar để nạp được
  - node_modules/onnxruntime-node/bin/**
npmRebuild: false
# Kiểm tra bản đóng gói có đủ onnxruntime-node (TTS) — thiếu thì dừng build, không ra bộ cài lỗi
afterPack: scripts/after-pack.cjs

# ───────────── Windows 10/11 x64: bộ cài NSIS (.exe) ─────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: MasterScoring
  # Bộ cài Windows x64: bỏ binary onnxruntime của macOS / Windows ARM
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
  requestedExecutionLevel: asInvoker
  # llama-server.exe (CPU + Vulkan) — tải bằng `npm run fetch:runtime`
  extraResources:
    - from: resources/runtime
      to: runtime
      filter:
        - '**/*'
  # Ký số: tự động bằng chứng chỉ tự ký build/cert (scripts/gen-cert.mjs + scripts/builder.mjs).
  # Có chứng chỉ thật thì đặt WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD — sẽ được ưu tiên.
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Master Scoring
  uninstallDisplayName: Master Scoring
  artifactName: MasterScoring-Setup-${version}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

# ───────────── macOS: Apple Silicon (arm64) + Intel (x64), file .dmg ─────────────
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.education
  # Bỏ binary onnxruntime của Windows (onnxruntime-node chỉ có bản macOS arm64 — Mac Intel không chạy được TTS)
  files:
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  # llama-server bản Metal theo từng kiến trúc — tải bằng `npm run fetch:runtime:mac`
  extraResources:
    - from: resources/runtime-mac/${arch}
      to: runtime
      filter:
        - '**/*'
  # Ký số + notarize (khuyến nghị khi phát hành): đặt CSC_LINK / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
dmg:
  artifactName: MasterScoring-${version}-${arch}.dmg
  title: Master Scoring ${version}
