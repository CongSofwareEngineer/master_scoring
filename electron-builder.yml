appId: com.masterscoring.app
productName: Master Scoring
copyright: Copyright © 2026 Master Scoring
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!src/**'
  - '!scripts/**'
  - '!resources/**'
  - '!release/**'
asar: true
asarUnpack:
  - node_modules/sql.js/dist/sql-wasm.wasm
npmRebuild: false

# ───────────── Windows 10/11 x64: bộ cài NSIS (.exe) ─────────────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: MasterScoring
  requestedExecutionLevel: asInvoker
  # llama-server.exe (CPU + Vulkan) — tải bằng `npm run fetch:runtime`
  extraResources:
    - from: resources/runtime
      to: runtime
      filter:
        - '**/*'
  # Ký số: đặt biến môi trường CSC_LINK / CSC_KEY_PASSWORD khi build
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Master Scoring
  uninstallDisplayName: Master Scoring
  artifactName: MasterScoring-Setup-${version}.exe
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: build/installer.nsh
  deleteAppDataOnUninstall: false

# ───────────── macOS: Apple Silicon (arm64) + Intel (x64), file .dmg ─────────────
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  icon: build/icon.png
  category: public.app-category.education
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  # llama-server bản Metal theo từng kiến trúc — tải bằng `npm run fetch:runtime:mac`
  extraResources:
    - from: resources/runtime-mac/${arch}
      to: runtime
      filter:
        - '**/*'
  # Ký số + notarize (khuyến nghị khi phát hành): đặt CSC_LINK / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID
dmg:
  artifactName: MasterScoring-${version}-${arch}.dmg
  title: Master Scoring ${version}
